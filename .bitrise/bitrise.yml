---
format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native
trigger_map:
- push_branch: master
  workflow: app_distribution_to_testers
- push_branch: develop
  workflow: primary
- pull_request_target_branch: develop
  workflow: primary
- pull_request_source_branch: "*"
  workflow: primary
workflows:
  app_distribution_to_testers:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@6: {}
    - script@1:
        title: Create .env file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # FOR NOW WE DO NOT NEED TO CREATE THIS FILE. UNCOMMENT IF NEEDED AGAIN
            #echo "import {Environment} from './Environment';
            #export const EnvironmentActual: Environment = {
            #  API_BASE_URL: $API_BASE_URL
            #};" > ./src/utils/EnvironmentActual.ts


            echo "DSN_KEY='$DSN_KEY'
            BUILD_NUMBER='$BITRISE_BUILD_NUMBER'
            API_BASE_URL='$API_BASE_URL'" > ./.env

            echo "Check if the file was properly created: "
            echo ""

            cat .env
    - install-react-native@0:
        inputs:
        - npm_options: "--force"
    - npm@1:
        inputs:
        - command: install
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - script@1:
        title: npx react-native bundle
        inputs:
        - content: |+
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            mkdir android/app/src/main/assets

            npx react-native bundle --entry-file index.js --platform android --bundle-output android/app/src/main/assets/index.android.bundle --dev true

    - gradle-runner@2:
        inputs:
        - apk_file_exclude_filter: "*-unaligned.apk\n\n"
        - gradle_task: assembleRelease
        - cache_level: all
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # write your script here
            cp $BITRISE_APK_PATH $BITRISE_DEPLOY_DIR/openboxes_test_b$BITRISE_BUILD_NUMBER.apk
        title: copy APK to deploy
    - deploy-to-bitrise-io@2:
        is_always_run: false
        inputs:
        - notify_email_list: "$TESTERS"
        - notify_user_groups: owner, admins, developers
        - deploy_path: "$BITRISE_DEPLOY_DIR/openboxes_test_b$BITRISE_BUILD_NUMBER.apk"
    triggers:
      enabled: false
  primary:
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - brew-install@1:
        inputs:
        - packages: jq
        is_skippable: true
        title: Brew install jq
    - git-clone@6:
        is_always_run: true
    - script@1:
        title: Create .env file
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # FOR NOW WE DO NOT NEED TO CREATE THIS FILE. UNCOMMENT IF NEEDED AGAIN
            #echo "import {Environment} from './Environment';
            #export const EnvironmentActual: Environment = {
            #  API_BASE_URL: $API_BASE_URL
            #};" > ./src/utils/EnvironmentActual.ts


            echo "DSN_KEY='$DSN_KEY'
            BUILD_NUMBER='$BITRISE_BUILD_NUMBER'
            API_BASE_URL='$API_BASE_URL'" > ./.env

            echo "Check if the file was properly created: "
            echo ""

            cat .env
    - nvm@1:
        inputs:
        - node_version: 14.21.3
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -exnpm install -g npm@6.14.18
        title: install npm 6.14.18
    - install-react-native@0.10:
        inputs:
        - version: 6.1.0
    - npm@1:
        inputs:
        - command: install
        - cache_local_deps: 'true'
        - npm_version: 6.14.18
        is_always_run: true
        title: npm run install
    - npm@1:
        inputs:
        - npm_version: 6.14.18
        - command: run branding:vipr
        is_skippable: true
        title: Branding VIPR
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
        - ndk_version: 21.4.7075529
        is_always_run: true
    - script@1:
        title: npx react-native bundle
        inputs:
        - content: |+
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            mkdir android/app/src/main/assets

            npx react-native bundle --entry-file index.js --platform android --bundle-output android/app/src/main/assets/index.android.bundle --dev true

    - gradle-runner@2:
        inputs:
        - apk_file_exclude_filter: "*-unaligned.apk\n\n"
        - gradle_task: assembleRelease
        - cache_level: all
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # debug log
            set -x

            # write your script here
            cp $BITRISE_APK_PATH $BITRISE_DEPLOY_DIR/openboxes_test_b$BITRISE_BUILD_NUMBER.apk
        title: copy APK to deploy
    - deploy-to-bitrise-io@2:
        is_always_run: false
        inputs:
        - notify_email_list: "$TESTERS"
        - notify_user_groups: owner, admins, developers
        - deploy_path: "$BITRISE_DEPLOY_DIR/openboxes_test_b$BITRISE_BUILD_NUMBER.apk"
    triggers:
      enabled: false
app:
  envs:
  - opts:
      is_expand: false
    GRADLE_BUILD_FILE_PATH: android/build.gradle
  - opts:
      is_expand: false
    GRADLEW_PATH: android/gradlew
  - opts:
      is_expand: false
    PROJECT_LOCATION: android
  - opts:
      is_expand: false
    MODULE: app
  - opts:
      is_expand: false
    VARIANT: staging
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: ios/openboxesexpo.xcworkspace
  - opts:
      is_expand: false
    BITRISE_SCHEME: openboxesexpo
  - opts:
      is_expand: false
    BITRISE_EXPORT_METHOD: development
  - opts:
      is_expand: false
    GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError"
  - opts:
      is_expand: false
    JAVA_OPTS: "-Xms512m -Xmx2048m"
meta:
  bitrise.io:
    stack: osx-xcode-14.3.x-ventura
