---
format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native

trigger_map:
- push_branch: develop
  workflow: android-only
- push_branch: master
  workflow: app_distribution_to_uat_testers
# Build a preview (APK + Appetize deploy) for every pull request into develop.
- pull_request_target_branch: develop
  workflow: android-only
- pull_request_source_branch: "*"
  enabled: false
  workflow: android-only

_dependency_versions:
  # https://github.com/android/ndk/wiki/Unsupported-Downloads#r21e
  android_ndk_version: &android_ndk_version 21.4.7075529
  # On stacks that support Xcode 16+, Bitrise's install-missing-android-tools
  # step ends up calling an sdkmanager release that requires Java 17+.
  java_version_ndk: &java_version_ndk 17
  # But for everything else we want to keep using Java 11
  java_version: &java_version 11
  node_version: &node_version 14.21.3
  # We use RN 0.66; use this table to find the correct version of react-native-cli
  # https://github.com/react-native-community/cli?tab=readme-ov-file#compatibility
  react_native_cli_version: &react_native_cli_version 6.4.0

step_bundles:
  setup-steps:
    description: |-
      Check out code, install common dependencies, and prepare the environment.
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8:
          is_always_run: true
      - script@1:
          inputs:
          - content: |-
              set -euxo pipefail
              echo "BUILD_NUMBER='$BITRISE_BUILD_NUMBER'
              API_BASE_URL='$API_BASE_URL'" > ./.env
              echo "Check if the file was properly created: "
              wc .env
          title: Script - create .env file
      - nvm@1:
          inputs:
          - node_version: *node_version
          title: Node Version Manager (NVM) - install Node.js
      - restore-npm-cache@2: {}
      - install-react-native@0:
          inputs:
          - version: *react_native_cli_version
          title: Install React Native - CLI tools
      - yarn@0:
          inputs:
          - command: install
          title: Run yarn command - install
      - save-npm-cache@1: {}
  setup-steps-android:
    description: |-
      Install Android-specific dependencies.
    steps:
      - set-java-version@1:
          inputs:
          - set_java_version: *java_version_ndk
      - install-missing-android-tools@3:
          inputs:
          - gradlew_path: "$GRADLEW_PATH"
          - ndk_version: *android_ndk_version
          is_always_run: true
      - set-java-version@1:
          inputs:
          - set_java_version: *java_version
      - change-android-versioncode-and-versionname@1:
          inputs:
            - new_version_code: $BITRISE_BUILD_NUMBER
            - new_version_name: '"1.0.0"'
            - build_gradle_path: $APP_GRADLE_BUILD_FILE_PATH
  setup-steps-ios:
    description: |-
      Install iOS-specific dependencies.
    steps:
      - restore-cocoapods-cache: {}
      - cocoapods-install@2:
          inputs:
          - source_root_path: "$BITRISE_SOURCE_DIR/ios"
      - save-cocoapods-cache: {}
  branding:
    description: |-
      Apply modifications for branding.
    steps:
    - brew-install@1:
        inputs:
        - packages: jq
        is_skippable: true
        title: Brew install - jq (required for branding:vipr)
    - yarn@0:
        inputs:
        - command: branding:vipr
        is_skippable: true
        title: Run yarn command - branding:vipr
  release-steps-android:
    description: |-
      Assemble the Android app and copy the APK to $BITRISE_DEPLOY_DIR.
      Deploy to Bitrise.io and Appetize.io for internal QA.
      Currently, filenames are hardcoded, but they could be parameterized.
    steps:
      - yarn@0:
          inputs:
          - command: bundle:android
          title: Run yarn command - bundle:android
      - restore-gradle-cache@2: {}
      - gradle-runner@3:
          inputs:
          - apk_file_exclude_filter: "*-unaligned.apk\n\n"
          - cache_level: all
          - gradle_task: assembleRelease
          title: Gradle Runner - assembleRelease
      - save-gradle-cache@1: {}
      - script@1:
          inputs:
          - content: |-
              set -euxo pipefail
              cp $BITRISE_APK_PATH $BITRISE_DEPLOY_DIR/openboxes_test_b$BITRISE_BUILD_NUMBER.apk
          title: Script - copy APK for deploy-to-bitrise-io step
      # Publish a public install page for PR builds only, so the build can be
      # installed by opening a link on the device itself (or scanning the QR
      # code Bitrise renders on that page) instead of going through adb. The URL
      # is long and random but unauthenticated: anyone who has it can install
      # the build. Develop and UAT builds keep the public page switched off.
      - script@1:
          title: Enable the public install page for PR builds
          inputs:
          - content: |-
              set -euo pipefail
              if [ -n "${BITRISE_PULL_REQUEST:-}" ]; then
                envman add --key IS_ENABLE_PUBLIC_PAGE --value "true"
              else
                envman add --key IS_ENABLE_PUBLIC_PAGE --value "false"
              fi
      - deploy-to-bitrise-io@2:
          inputs:
          - deploy_path: "$BITRISE_DEPLOY_DIR/openboxes_test_b$BITRISE_BUILD_NUMBER.apk"
          - notify_email_list: "$TESTERS"
          - notify_user_groups: owner, admins, developers
          - is_enable_public_page: "$IS_ENABLE_PUBLIC_PAGE"
          is_always_run: false
      # Post the install link back to the pull request, replacing the comment
      # from the previous build so the thread keeps a single, current link.
      # Requires GITHUB_ACCESS_TOKEN (a secret with repo scope) on the Bitrise
      # app; the step is skipped while that is unset.
      - script@1:
          title: Comment the install link on the pull request
          run_if: '{{and (ne (getenv "BITRISE_PULL_REQUEST") "") (ne (getenv "GITHUB_ACCESS_TOKEN") "") (ne (getenv "BITRISE_PUBLIC_INSTALL_PAGE_URL") "")}}'
          is_skippable: true
          inputs:
          - content: |-
              set -euo pipefail
              python3 - <<'PYTHON'
              import json, os, re, urllib.error, urllib.request

              MARKER = "<!-- openboxes-mobile-apk-install -->"
              API = "https://api.github.com"

              token = os.environ["GITHUB_ACCESS_TOKEN"]
              pr = os.environ["BITRISE_PULL_REQUEST"]
              install_url = os.environ["BITRISE_PUBLIC_INSTALL_PAGE_URL"]
              build = os.environ.get("BITRISE_BUILD_NUMBER", "")
              build_url = os.environ.get("BITRISE_BUILD_URL", "")
              sha = os.environ.get("BITRISE_GIT_COMMIT", "")[:8]

              repository = re.search(r"github\.com[:/]+([^/]+)/(.+?)(?:\.git)?$",
                                     os.environ.get("GIT_REPOSITORY_URL", ""))
              if not repository:
                  raise SystemExit("Could not parse GIT_REPOSITORY_URL; skipping comment.")
              repo = "%s/%s" % repository.groups()

              body = "\n".join([
                  "### Test build for this pull request",
                  "",
                  "**[Install on a device](%s)** - open that link on the device (or scan the"
                  % install_url,
                  "QR code on the page) and tap the download. Bitrise build [%s](%s)%s."
                  % (build, build_url, (", commit `%s`" % sha) if sha else ""),
                  "",
                  "Installs as **OpenBoxes (Experimental)**, applicationId",
                  "`com.openboxes.android.experimental`, so it sits alongside the regular app",
                  "rather than replacing it.",
                  "",
                  "<details><summary>Install over adb instead</summary>",
                  "",
                  "```",
                  "yarn adb:connect            # reconnect the Zebra devices",
                  "yarn apk:install --pr %s  # install this build on all of them" % pr,
                  "```",
                  "</details>",
                  "",
                  MARKER,
              ])

              def call(url, data=None, method=None):
                  request = urllib.request.Request(
                      url,
                      data=json.dumps(data).encode() if data is not None else None,
                      method=method,
                      headers={"Authorization": "token " + token,
                               "Accept": "application/vnd.github+json",
                               "Content-Type": "application/json",
                               "User-Agent": "openboxes-mobile-bitrise"})
                  with urllib.request.urlopen(request) as response:
                      return json.loads(response.read() or "null")

              try:
                  existing = next(
                      (comment for comment in
                       call("%s/repos/%s/issues/%s/comments?per_page=100" % (API, repo, pr))
                       if MARKER in (comment.get("body") or "")), None)
                  if existing:
                      call("%s/repos/%s/issues/comments/%s" % (API, repo, existing["id"]),
                           {"body": body}, method="PATCH")
                      print("Updated the install link comment on PR #%s." % pr)
                  else:
                      call("%s/repos/%s/issues/%s/comments" % (API, repo, pr), {"body": body})
                      print("Commented the install link on PR #%s." % pr)
              except urllib.error.HTTPError as error:
                  print("Warning: could not comment on PR #%s: %s %s"
                        % (pr, error.code, error.read().decode("utf-8", "replace")))
              PYTHON
      # Pick which Appetize app to deploy to based on build type: PR builds go to
      # the PR preview app, everything else (e.g. develop push) to the main app.
      # BITRISE_PULL_REQUEST is set (to the PR number) only on pull request builds.
      - script@1:
          title: Select Appetize app by build type
          inputs:
          - content: |-
              set -euo pipefail
              if [ -n "${BITRISE_PULL_REQUEST:-}" ]; then
                echo "PR build - deploying to PR preview app"
                envman add --key APPETIZE_PUBLIC_KEY --value "${APPETIZE_PR_PUBLIC_KEY:-}"
              else
                echo "Push build - deploying to main app"
                envman add --key APPETIZE_PUBLIC_KEY --value "${APPETIZE_DEVELOP_PUBLIC_KEY:-}"
              fi
      - appetize-deploy@0:
          # Skip the deploy when no target app key is configured, so we never fall
          # back to creating a new app (which would overwrite the main app).
          run_if: '{{enveq "APPETIZE_PUBLIC_KEY" "" | not}}'
          inputs:
          - app_path: $BITRISE_DEPLOY_DIR/openboxes_test_b$BITRISE_BUILD_NUMBER.apk
          - appetize_token: $APPETIZE_API_TOKEN
          - public_key: $APPETIZE_PUBLIC_KEY
      # Annotate the deployed Appetize app with build context (PR/branch/commit).
      # The appetize-deploy step can't set a note, so call the v1 API directly.
      # v1 supports "note" but not "tags"; failures here are non-fatal.
      - script@1:
          title: Set Appetize note with build context
          run_if: '{{enveq "APPETIZE_PUBLIC_KEY" "" | not}}'
          inputs:
          - content: |-
              set -euo pipefail
              SHA="${BITRISE_GIT_COMMIT:-}"
              SHA="${SHA:0:8}"
              if [ -n "${BITRISE_PULL_REQUEST:-}" ]; then
                NOTE="PR #${BITRISE_PULL_REQUEST} - ${BITRISE_GIT_BRANCH:-} - ${SHA} - build ${BITRISE_BUILD_NUMBER:-}"
              else
                NOTE="${BITRISE_GIT_BRANCH:-} - ${SHA} - build ${BITRISE_BUILD_NUMBER:-}"
              fi
              # Build the JSON body without jq (which may be skipped) so this step
              # is self-contained. Escape backslashes and double quotes for JSON.
              ESCAPED="$(printf '%s' "$NOTE" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')"
              BODY="{\"note\":\"${ESCAPED}\"}"
              if curl -fsS -X POST "https://api.appetize.io/v1/apps/${APPETIZE_PUBLIC_KEY}" \
                   -H "X-API-KEY: ${APPETIZE_API_TOKEN}" \
                   -H "Content-Type: application/json" \
                   -d "$BODY" > /dev/null; then
                echo "Set Appetize note: ${NOTE}"
              else
                echo "Warning: failed to set Appetize note (non-fatal)"
              fi
  release-steps-android-signed:
    description: |-
      Assemble the Android app and copy the signed APK to $BITRISE_DEPLOY_DIR.
      Currently, filenames are hardcoded, but they could be parameterized.
    steps:
      - yarn@0:
          inputs:
          - command: bundle:android
          title: Run yarn command - bundle:android
      - restore-gradle-cache@2: {}
      - gradle-runner@3:
          inputs:
          - apk_file_exclude_filter: "*-unaligned.apk\n\n"
          - cache_level: all
          - gradle_task: assembleRelease
          title: Gradle Runner - assembleRelease
      - save-gradle-cache@1: {}
      - sign-apk@2:
          inputs:
          - keystore_url: $BITRISEIO_ANDROID_KEYSTORE_1_URL
          - keystore_password: $BITRISEIO_ANDROID_KEYSTORE_1_PASSWORD
          - keystore_alias: $BITRISEIO_ANDROID_KEYSTORE_1_ALIAS
          - private_key_password: $BITRISEIO_ANDROID_KEYSTORE_1_PRIVATE_KEY_PASSWORD
      - script@1:
          inputs:
          - content: |-
              set -euxo pipefail
              cp $BITRISE_APK_PATH $BITRISE_DEPLOY_DIR/openboxes_uat_b$BITRISE_BUILD_NUMBER.apk
          title: Script - copy APK for deploy-to-bitrise-io step
      - deploy-to-bitrise-io@2:
          inputs:
          - deploy_path: "$BITRISE_DEPLOY_DIR/openboxes_uat_b$BITRISE_BUILD_NUMBER.apk"
          - notify_email_list: "$UAT_TESTERS"
          - notify_user_groups: owner, admins
          is_always_run: false
      # TODO: Send to private GPS
  release-steps-ios:
    description: |-
      Assemble the iOS app and copy the *.app package to $BITRISE_DEPLOY_DIR.
    steps:
      - yarn@0:
          inputs:
          - command: bundle:ios
          title: Run yarn command - bundle:ios
      - script@1:
          inputs:
          - content: |-
              set -euxo pipefail
              plutil -lint "$BITRISE_SOURCE_DIR/ios/openboxes_mobile_o.xcodeproj/project.pbxproj"
              swift --version
              xcodebuild -version
          title: Script - check project.pbxproj validity and Xcode version
      - xcode-build-for-simulator@3:
          inputs:
          - export_method: "$BITRISE_EXPORT_METHOD"
          - project_path: "$BITRISE_PROJECT_PATH"
          - scheme: "$BITRISE_SCHEME"
      - deploy-to-bitrise-io@2:
          inputs:
          - deploy_path: "$BITRISE_XCODEBUILD_BUILD_FOR_SIMULATOR_LOG_PATH"
          - notify_user_groups: developers
          is_always_run: true
          title: Deploy to Bitrise.io - Xcode build log
      - deploy-to-bitrise-io@2:
          inputs:
          - deploy_path: "$BITRISE_APP_DIR_PATH"
          - notify_email_list: "$UAT_TESTERS"
          - notify_user_groups: owner, admins, developers
          is_always_run: false
workflows:
  app_distribution_to_testers:
    steps:
    - bundle::setup-steps: {}
    - bundle::setup-steps-android: {}
    - bundle::setup-steps-ios: {}
    - bundle::release-steps-android: {}
    - bundle::release-steps-ios: {}
    triggers:
      enabled: false
  app_distribution_to_uat_testers:
    steps:
    - bundle::setup-steps: {}
    - bundle::setup-steps-android: {}
    - bundle::branding: {}
    - bundle::release-steps-android-signed: {}
    triggers:
      enabled: false
  android-only:
    steps:
    - bundle::setup-steps: {}
    - bundle::setup-steps-android: {}
    - bundle::branding: {}
    # On PR builds only, mark the build as experimental: append "(Experimental)"
    # to the app name AND give it a distinct applicationId. Appetize keys apps by
    # applicationId, so the suffix makes the PR build a separate Appetize app
    # (its own URL) instead of overwriting the stable app. Runs after branding
    # (which sets app_name) and before the release assemble.
    - script@1:
        title: Mark PR builds as experimental (name + applicationId)
        run_if: '{{getenv "BITRISE_PULL_REQUEST" | ne ""}}'
        inputs:
        - content: |-
            set -euo pipefail
            STRINGS_FILE="android/app/src/main/res/values/strings.xml"
            GRADLE_FILE="android/app/build.gradle"
            sed -i.bak -E 's#(<string name="app_name">)([^<]*)(</string>)#\1\2 (Experimental)\3#' "$STRINGS_FILE"
            rm -f "$STRINGS_FILE.bak"
            sed -i.bak -E 's#(applicationId "com\.openboxes\.android)(")#\1.experimental\2#' "$GRADLE_FILE"
            rm -f "$GRADLE_FILE.bak"
            echo "app_name and applicationId are now:"
            grep app_name "$STRINGS_FILE"
            grep applicationId "$GRADLE_FILE"
    - bundle::release-steps-android: {}
    triggers:
      enabled: false
  ios-only:
    steps:
    - bundle::setup-steps: {}
    - bundle::setup-steps-ios: {}
    - bundle::branding: {}
    - bundle::release-steps-ios: {}
    triggers:
      enabled: false
app:
  envs:
  - opts:
      is_expand: false
    BITRISE_EXPORT_METHOD: development
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: ios/openboxes_mobile_o.xcworkspace
  - opts:
      is_expand: false
    BITRISE_SCHEME: openboxes_mobile_o
  - opts:
      is_expand: false
    # Top-level build file
    GRADLE_BUILD_FILE_PATH: android/build.gradle
  - opts:
      is_expand: false
    # Module-level build file
    APP_GRADLE_BUILD_FILE_PATH: android/app/build.gradle
  - opts:
      is_expand: false
    #
    # The --add-opens=... argument prevents the following error and may not be
    # necessary in the future (e.g., if we upgrade Gradle or React Native):
    #   java.lang.reflect.InaccessibleObjectException: Unable to make field private final java.lang.String java.io.File.path accessible: module java.base does not "opens java.io" to unnamed module @4191eb2a
    #
    GRADLE_OPTS:
      -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.base/java.io=ALL-UNNAMED"
  - opts:
      is_expand: false
    GRADLEW_PATH: android/gradlew
  - opts:
      is_expand: false
    JAVA_OPTS: "-Xms512m -Xmx2048m"
  - opts:
      is_expand: false
    MODULE: app
  - opts:
      is_expand: false
    PROJECT_LOCATION: android
  - opts:
      is_expand: false
    VARIANT: staging
  # Appetize app public keys (from the app's share URL: appetize.io/app/<key>).
  # These are not secrets. The main app is used by develop; PR builds deploy to a
  # separate PR preview app. Leave APPETIZE_PR_PUBLIC_KEY empty until the PR
  # preview app exists — the appetize-deploy run_if guard skips the deploy while
  # it is empty, so PR builds never overwrite the main app.
  - opts:
      is_expand: false
    APPETIZE_DEVELOP_PUBLIC_KEY: 67t5r4akxrtgvujo7adbiifau4
  - opts:
      is_expand: false
    APPETIZE_PR_PUBLIC_KEY: "b_wchsvah7t6ytekpcvd2pvqavty"

meta:
  bitrise.io:
    stack: osx-xcode-16.4.x
